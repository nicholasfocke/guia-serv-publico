spring:
  application:
    name: guia-serv-publico

  datasource:
    url: jdbc:postgresql://localhost:5432/guia_serv_publico
    username: postgres
    password: post

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs