spring:
  application:
    name: guia-serv-publico

  datasource:
    url: jdbc:postgresql://localhost:5432/guia_serv_publico
    username: postgres
    password: post

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0xMjM0NTY3ODkw}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}