spring:
  application:
    name: guia-serv-publico

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guia_serv_publico}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:post}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS0xMjM0NTY3ODkw}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}